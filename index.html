<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slidedim Library</title>
    <link rel="stylesheet" href="./src/slidedim.css" />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .slidedim-slide {
        padding: 30px;
        text-align: center;
      }

      .slide-1 {
        background: violet;
      }

      .slide-2 {
        background: blanchedalmond;
      }

      .slide-3 {
        background: goldenrod;
      }

      .slide-4 {
        background: blueviolet;
      }

      .slide-5 {
        background: grey;
      }

      .slide-6 {
        background: wheat;
      }
    </style>
  </head>
  <body>
    <div id="my-slider">
      <div class="slide-1">Slider 1</div>
      <div class="slide-2">Slider 2</div>
      <div class="slide-3">Slider 3</div>
      <div class="slide-4">Slider 4</div>
      <div class="slide-5">Slider 5</div>
      <div class="slide-6">Slider 6</div>
    </div>

    <script src="./src/slidedim.js"></script>
    <script>
      const mySlider = new Slidedim("#my-slider", {
        items: 1,
        speed: 400,
        loop: true,
        slideBy: 1,
        autoplay: true,
        autoplayHoverPause: 5000,
        stopAutoPlay: true,
      });
    </script>
  </body>
</html>
